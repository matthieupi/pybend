what_to_build: |
  This issue is superseded by issue 010. The migration no longer adds `$href` or
  `links` before a later `$id` flip; issue 010 flips response `$id` directly to
  class-name identity.

  Keep this issue as a HITL compatibility/documentation checkpoint after issues
  010–017 land. Use it to decide whether any external migration notes,
  compatibility flags, or deprecation timelines are needed for clients that
  stored old table-name `$id` values.
acceptance_criteria:
  - "Issue 010 has implemented class-name `$id` for regular and nested responses."
  - "Legacy table-name routes remain available for clients with stored old URLs."
  - "Docs clearly state that response identity is now class-name based."
  - "Release notes or migration guidance call out the public `$id` change."
  - "A compatibility flag is either explicitly rejected or planned as a separate issue."
implementation_notes:
