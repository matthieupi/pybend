<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NTTTX - Matrix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dark-theme.css">
    <link rel="stylesheet" href="./light-theme.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <!-- Preload component CSS — loaded by Shadow DOM at runtime -->
    <link rel="preload" href="./components/ntt-item.css" as="style" crossorigin>
    <link rel="preload" href="./components/ntt-list.css" as="style" crossorigin>
    <link rel="preload" href="./components/ntt-router.css" as="style" crossorigin>
    <link rel="preload" href="./components/ntt-topbar.css" as="style" crossorigin>
    <link rel="preload" href="./components/ntt-user.css" as="style" crossorigin>
    <!-- Modulepreload entire dependency tree — eliminates import waterfall -->
    <!-- Leaves -->
    <link rel="modulepreload" href="./config.js">
    <link rel="modulepreload" href="./utils/Assert.js">
    <link rel="modulepreload" href="./utils/Logging.js">
    <link rel="modulepreload" href="./utils/Permissions.js">
    <!-- Core -->
    <link rel="modulepreload" href="./core/Utils.js">
    <link rel="modulepreload" href="./core/TX.js">
    <link rel="modulepreload" href="./core/Observable.js">
    <link rel="modulepreload" href="./core/Actor.js">
    <link rel="modulepreload" href="./core/Matrix.js">
    <link rel="modulepreload" href="./core/Component.js">
    <link rel="modulepreload" href="./core/Router.js">
    <link rel="modulepreload" href="./core/NTT.js">
    <!-- Transport -->
    <link rel="modulepreload" href="./core/transport/HTTP.js">
    <link rel="modulepreload" href="./core/transport/NetworkAdapter.js">
    <!-- Components -->
    <link rel="modulepreload" href="./components/NTTElement.js">
    <link rel="modulepreload" href="./components/ListElement.js">
    <link rel="modulepreload" href="./components/ntt-item.js">
    <link rel="modulepreload" href="./components/ntt-list.js">
    <link rel="modulepreload" href="./components/ntt-router.js">
    <link rel="modulepreload" href="./components/ntt-method.js">
    <link rel="modulepreload" href="./components/ntt-favorites.js">
    <link rel="modulepreload" href="./generators/form.js">
    <script type="module" src="./utils/theme.js"></script>
</head>
<body>

    <ntt-topbar></ntt-topbar>

    <div class="page">
        <ntt-router name="main" hash>
            <ntt-list model="Product" id="product-list"></ntt-list>
        </ntt-router>
    </div>

    <ntt-logs></ntt-logs>

    <script type="module">
        import Logging from './utils/Logging.js';
        Logging.init("Loading NTTTX Framework v0.6...");

        import {Matrix, matrix} from './core/Matrix.js';
        import { NTT } from './core/NTT.js';
        import { config } from './config.js';
        import { permissions } from './utils/Permissions.js';
        import './components/ntt-item.js';
        import './components/ntt-user.js';
        import './components/ntt-list.js';
        import './components/ntt-router.js';
        import './components/ntt-topbar.js';
        import './components/ntt-profile.js';
        import './components/ntt-logs.js';
        import './components/ntt-favorites.js';

        // Initialize permissions (non-blocking — components degrade gracefully)
        permissions.init();
    </script>

</body>
</html>
