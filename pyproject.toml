[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n3tx"
version = "0.7.0"
description = "Schema-driven full-stack framework for Python. Define a model, get an API, a schema, a working UI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matthieu Pi", email = "qcpi@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]
dependencies = [
    "pydantic>=2.7,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
flask = ["Flask>=3.1", "flasgger>=0.9"]
agents = ["pydantic-ai>=1.0"]
dev = ["pytest>=8.2", "pytest-cov>=6.0", "httpx>=0.27", "pyinstrument>=4.6", "requests>=2.31", "pydantic-ai>=1.0"]

[project.urls]
Homepage = "https://github.com/matthieupi/n3tx"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"n3tx" = [
    "static/**/*",
]
