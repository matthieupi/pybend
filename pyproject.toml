[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n3tx"
version = "0.10.0"
description = "Schema-driven full-stack framework for Python. Define a model, get an API, a schema, a working UI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matthieu Pi", email = "qcpi@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]
dependencies = [
    "n3tx-core>=0.10.0",
    "n3tx-actors>=0.10.0",
    "n3tx-ui>=0.10.0",
]

[project.optional-dependencies]
agents = ["n3tx-agents>=0.10.0"]
flask = ["Flask>=3.1", "flasgger>=0.9"]
dev = ["pytest>=8.2", "pytest-cov>=6.0", "httpx>=0.27", "pyinstrument>=4.6", "requests>=2.31", "pydantic-ai>=1.0"]

[project.urls]
Homepage = "https://github.com/matthieupi/n3tx"

[tool.setuptools.packages.find]
where = ["packages/n3tx/src"]

[tool.setuptools.package-data]
"n3tx_meta" = []

[tool.pytest.ini_options]
markers = [
    "unit: fast unit-level tests",
    "integration: integration tests that exercise multiple modules or HTTP/API flows",
    "e2e: end-to-end/browser or full application flow tests",
]
