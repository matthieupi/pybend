    <script>
        window.NTX_THEME_CONFIG = { themes: ['industrial', 'light', 'dark'] };
    </script>
    <script>
        window.NTX_AGENT_CATALOGS = {
            veille: [
                {
                    id: 'pipeline',
                    title: 'Pipeline Agent',
                    summary: 'Runs the source-to-grant pipeline and monitors the operational board.',
                    icon: 'veille-execute',
                    route: '',
                    cta: 'Open Pipeline',
                    kind: 'built-in',
                },
                {
                    id: 'grant-analysis',
                    title: 'Grant Analysis Agent',
                    summary: 'Explains admissibility inside the Grants workflow instead of as a standalone record.',
                    icon: 'veille-analyze',
                    route: 'grants',
                    cta: 'Open Grants',
                    kind: 'built-in',
                },
            ],
        };
    </script>
    <script type="module" src="./utils/theme.js"></script>
</head>
    <body class="veille-app">
        <ntx-topbar hide-brand>
            <div slot="nav" class="veille-topbar-shell">
                <label class="veille-topbar-search" aria-label="Search industrial intelligence">
                    <ntx-icon value="veille-search" decorative></ntx-icon>
                    <input type="search" id="veille-search" placeholder="Search industrial intelligence..." />
                </label>
                <div class="veille-topbar-actions" aria-label="Quick actions">
                    <button type="button" class="veille-topbar-icon" data-route="" aria-label="Open intelligence board">
                        <ntx-icon value="veille-dashboard" decorative></ntx-icon>
                    </button>
                    <button type="button" class="veille-topbar-icon" data-route="sources" aria-label="Open source registry">
                        <ntx-icon value="veille-registry" decorative></ntx-icon>
                    </button>
                </div>
            </div>
            <ntx-theme-button slot="user-menu"></ntx-theme-button>
        </ntx-topbar>
        <ntx-sidebar router="main" brand="Veille" subtitle="Industrial Intel" brand-logo="./veille-logo.svg">
            <ntx-table model="Source" allow-create></ntx-table>
            <ntx-list model="Grant" allow-create></ntx-list>
            <ntx-agents model="AgentActor" sidebar-label="Agents" catalog="veille" title="Agents"></ntx-agents>
            <ntx-item model="Organization"></ntx-item>
            <button slot="footer" type="button" class="veille-shell-cta" data-route="">
                <ntx-icon value="veille-new-pipeline" decorative></ntx-icon>
                <span>New Pipeline</span>
            </button>
            <ntx-theme-button slot="footer"></ntx-theme-button>
        </ntx-sidebar>

    <div class="page">
        <ntx-router name="main">
            <ntx-run-panel id="run-panel"></ntx-run-panel>
            <div id="source-panel" style="display:none">
                <ntx-table model="Source" id="source-list" allow-create></ntx-table>
                <div class="upload-section" id="upload-section">
                    <h3>Upload Strategic Document</h3>
                    <div class="upload-row">
                        <input type="file" id="doc-file" accept=".pdf,.txt,.md,.doc,.docx" />
                        <button id="upload-btn" onclick="uploadDocument()">Upload</button>
                    </div>
                    <div class="upload-status" id="upload-status"></div>
                </div>
            </div>
            <div id="grant-panel" style="display:none">
                <ntx-list model="Grant" id="grant-list" allow-create></ntx-list>
            </div>
            <ntx-grant-analyze id="analyze-panel" model="Grant" method="analyze" style="display:none"></ntx-grant-analyze>
            <ntx-run-report id="report-panel" style="display:none"></ntx-run-report>
        </ntx-router>
    </div>

    <button id="veille-fab" class="veille-fab" type="button" aria-label="Jump to dashboard controls">
        <ntx-icon value="veille-bolt" decorative></ntx-icon>
    </button>

    <script type="module">
        import './utils/veille-icons.js';
        import Logging from './utils/Logging.js';
        Logging.init("Loading Veille v1.0...");

        import { Matrix, matrix } from './core/Matrix.js';
        import { NTT } from './core/NTT.js';
        import { permissions } from './utils/Permissions.js';
        import './components/ntx-item.js';
        import './components/ntx-list.js';
        import './components/ntx-router.js';
        import './components/ntx-topbar.js?shell-layout-1';
        import './components/ntx-sidebar.js';
        import './components/ntx-agents.js';
        import './components/ntx-profile.js';
        import './components/ntx-stream.js';
        import './components/ntx-stream-agent.js';
        import './components/ntx-agent.js';
        import './components/ntx-table.js';
        import './components/ntx-grant-item.js';
        import './components/ntx-grant-analyze.js';
        import './components/ntx-run-item.js';
        import './components/ntx-run-output.js';
        import './components/ntx-run-panel.js';
        import './components/ntx-run-report.js';

        // Redirect to login if not authenticated
        permissions.init().then(user => {
            if (!user) {
                window.location.href = '/login.html';
            }
        });

        // Simple hash-based routing
        function handleRoute() {
            const hash = window.location.hash.replace('#', '') || '';
            const panels = ['run-panel', 'source-panel', 'grant-panel',
                            'analyze-panel', 'report-panel'];
            panels.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });

            if (hash === 'sources') {
                document.getElementById('source-panel').style.display = 'block';
            } else if (hash === 'grants') {
                document.getElementById('grant-panel').style.display = 'block';
            } else if (hash.startsWith('analyze/')) {
                const grantId = hash.split('/')[1];
                const el = document.getElementById('analyze-panel');
                if (el && grantId) {
                    el.setAttribute('uuid', grantId);
                    el.style.display = 'block';
                }
            } else if (hash.startsWith('report/')) {
                const runId = hash.split('/')[1];
                const el = document.getElementById('report-panel');
                if (el && runId) {
                    el.setAttribute('run-id', runId);
                    el.style.display = 'block';
                }
            } else {
                document.getElementById('run-panel').style.display = 'block';
            }
        }

        document.querySelectorAll('[data-route]').forEach((button) => {
            button.addEventListener('click', () => {
                const route = button.getAttribute('data-route');
                if (route === '') {
                    matrix.dispatch({
                        name: 'NAVIGATE',
                        source: 'veille-shell',
                        target: 'main',
                        data: '',
                        meta: { reset: true },
                    });
                    return;
                }
                window.location.hash = route ?? 'runs';
            });
        });

        document.getElementById('veille-fab')?.addEventListener('click', () => {
            window.location.hash = 'runs';
            requestAnimationFrame(() => {
                document.getElementById('run-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                document.querySelector('#run-panel .run-url-input')?.focus();
            });
        });

        document.getElementById('veille-search')?.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter') return;
            event.preventDefault();
            window.location.hash = 'grants';
        });

        window.addEventListener('hashchange', handleRoute);
        handleRoute();
    </script>

    <script>
        // Document upload handler (plain script, no module -- needs global access for onclick)
        async function uploadDocument() {
            const fileInput = document.getElementById('doc-file');
            const statusEl = document.getElementById('upload-status');
            const file = fileInput.files[0];
            if (!file) {
                statusEl.textContent = 'Please select a file first.';
                statusEl.className = 'upload-status error';
                return;
            }

            const token = window.localStorage.getItem('jwtToken');
            if (!token) {
                statusEl.textContent = 'Not authenticated. Please log in.';
                statusEl.className = 'upload-status error';
                return;
            }

            statusEl.textContent = 'Uploading...';
            statusEl.className = 'upload-status';

            try {
                const formData = new FormData();
                formData.append('file', file);
                const resp = await fetch('/organizations/upload', {
                    method: 'POST',
                    headers: { 'x-access-token': token },
                    body: formData,
                });
                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.detail || 'Upload failed');
                }
                statusEl.textContent = 'Uploaded: ' + data.filename + ' (' + data.size + ' bytes)';
                statusEl.className = 'upload-status';
                fileInput.value = '';
            } catch (err) {
                statusEl.textContent = err.message;
                statusEl.className = 'upload-status error';
            }
        }
    </script>
</body>
</html>
