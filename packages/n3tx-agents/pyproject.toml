[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n3tx-agents"
version = "0.10.0"
description = "N3TX agents: AgentMixin, AgentActor, tool discovery, LLM integration."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matthieu Pi", email = "qcpi@gmail.com"}]
dependencies = [
    "n3tx-core>=0.10.0",
    "n3tx-actors>=0.10.0",
    "pydantic-ai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"n3tx_agents" = ["static/**/*"]
