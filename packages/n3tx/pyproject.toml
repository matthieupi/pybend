[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n3tx"
version = "0.10.0"
description = "N3TX meta-package: installs n3tx-core, n3tx-actors, n3tx-ui, n3tx-agents."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matthieu Pi", email = "qcpi@gmail.com"}]
dependencies = [
    "n3tx-core>=0.10.0",
    "n3tx-actors>=0.10.0",
    "n3tx-ui>=0.10.0",
    "n3tx-agents>=0.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
