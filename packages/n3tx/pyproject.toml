[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n3tx"
version = "0.12.0"
description = """\
N3TX meta-package: installs N3TX core, actors, UI, threads, agents, and files.\
"""
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matthieu Pi", email = "matthieupi1.4@gmail.com"}]
dependencies = [
    "n3tx-core>=0.12.0",
    "n3tx-actors>=0.12.0",
    "n3tx-ui>=0.12.0",
    "n3tx-threads>=0.12.0",
    "n3tx-agents>=0.12.0",
    "n3tx-files>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Changelog
# - 2026-11-02: Include n3tx-threads in the full meta-package dependency set.
