# Codec-neutral thread storage and execution capture package metadata.
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n3tx-threads"
version = "0.12.0"
description = "N3TX threads: TX snapshots, notes, and opt-in execution capture."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matthieu Pi", email = "qcpi@gmail.com"}]
dependencies = [
    "n3tx-core>=0.12.0",
    "n3tx-actors>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Changelog (TOML has no block-comment syntax).
