[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n3tx-actors"
version = "0.10.0"
description = "N3TX actors: Actor/Matrix/TX system, ActorModel bridge, network adapters."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matthieu Pi", email = "qcpi@gmail.com"}]
dependencies = [
    "n3tx-core>=0.10.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
