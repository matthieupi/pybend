[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n3tx-trace"
version = "0.12.0"
description = "N3TX trace: Actor transaction visualization and debugging tool."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matthieu Pi", email = "qcpi@gmail.com"}]
dependencies = [
    "n3tx-core>=0.12.0",
    "n3tx-actors>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
n3tx_trace = ["static/**/*"]
