[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n3tx-core"
version = "0.10.0"
description = "N3TX core: models, storage, auth, API routes, schema pipeline, and JS runtime."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matthieu Pi", email = "qcpi@gmail.com"}]
dependencies = [
    "pydantic>=2.7,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
flask = ["Flask>=3.1", "flasgger>=0.9"]
dev = ["pytest>=8.2", "pytest-cov>=6.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"n3tx_core" = ["static/**/*"]
