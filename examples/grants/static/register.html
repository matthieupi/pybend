<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Grant Watcher</title>
  <link rel="stylesheet" href="./theme-base.css" />
  <link rel="stylesheet" href="./dark-theme.css" />
  <link rel="stylesheet" href="./light-theme.css" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <script>
    window.NTX_THEME_CONFIG = { themes: ['dark', 'light'] };
  </script>
  <script type="module" src="./utils/theme.js"></script>
  <style>
    .auth-page {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--ntx-card-bg);
      background-image: none;
      backdrop-filter: blur(28px) saturate(1.2);
      -webkit-backdrop-filter: blur(28px) saturate(1.2);
      border: 1px solid var(--ntx-border-default);
      border-top-color: var(--ntx-border-default, transparent);
      border-radius: var(--ntx-radius-xl);
      padding: 2.5rem;
      box-shadow: var(--ntx-shadow-xl);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .auth-header p {
      color: var(--ntx-color-text-muted);
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ntx-color-text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input {
      width: 100%;
    }

    .auth-btn {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .auth-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--ntx-color-text-muted);
    }

    .auth-link a {
      color: var(--ntx-color-accent-text);
      text-decoration: none;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .auth-error {
      background: var(--ntx-status-error-bg);
      border: 1px solid var(--ntx-status-error-border);
      color: var(--ntx-status-error-fg);
      padding: 0.6rem 0.85rem;
      border-radius: var(--ntx-radius-sm);
      font-size: 0.825rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create account</h1>
        <p>Get started with Grant Watcher</p>
      </div>

      <div class="auth-error" id="error-msg"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Choose a password" required minlength="6" />
        </div>
        <button type="submit" class="auth-btn">Create account</button>
      </form>

      <div class="auth-link">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const errorEl = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const resp = await fetch('/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password }),
        });

        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.detail || 'Registration failed');
        }

        const data = await resp.json();
        // Compat: debug envelope nests result under 'data' key when DEBUG=True
        // TODO: remove this fallback once responses use TX-based wire format
        const token = data.token || (data.data && data.data.token);
        window.localStorage.setItem('jwtToken', token);
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });

    // If already logged in, validate token then redirect
    const existingToken = window.localStorage.getItem('jwtToken');
    if (existingToken) {
      fetch('/Grant', { headers: { 'x-access-token': existingToken } })
        .then(resp => {
          if (resp.ok) {
            window.location.href = '/';
          } else {
            window.localStorage.removeItem('jwtToken');
          }
        })
        .catch(() => {
          window.localStorage.removeItem('jwtToken');
        });
    }
  </script>
</body>
</html>
