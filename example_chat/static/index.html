<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N3TX Chat</title>
<link rel="stylesheet" href="./dark-theme.css">
<!-- Preload component CSS for Shadow DOM -->
<link rel="preload" href="./components/ntx-item.css" as="style">
<link rel="preload" href="./components/ntx-chat-sidebar.css" as="style">
<link rel="preload" href="./components/ntx-chat-conv.css" as="style">
<link rel="preload" href="./components/ntx-chat-view.css" as="style">
<link rel="preload" href="./components/ntx-chat-message.css" as="style">
<link rel="preload" href="./components/ntx-chat-input.css" as="style">
<!-- Vendor libraries -->
<script src="./vendor/marked.min.js"></script>
<!-- Modulepreload dependency tree -->
<link rel="modulepreload" href="./config.js">
<link rel="modulepreload" href="./utils/Assert.js">
<link rel="modulepreload" href="./utils/Logging.js">
<link rel="modulepreload" href="./utils/Permissions.js">
<link rel="modulepreload" href="./core/Utils.js">
<link rel="modulepreload" href="./core/TX.js">
<link rel="modulepreload" href="./core/Observable.js">
<link rel="modulepreload" href="./core/Actor.js">
<link rel="modulepreload" href="./core/Matrix.js">
<link rel="modulepreload" href="./core/Component.js">
<link rel="modulepreload" href="./core/NTT.js">
<link rel="modulepreload" href="./core/transport/HTTP.js">
<link rel="modulepreload" href="./core/transport/NetworkAdapter.js">
<link rel="modulepreload" href="./components/NTTElement.js">
<link rel="modulepreload" href="./components/ListElement.js">
<link rel="modulepreload" href="./components/ntx-item.js">
<link rel="modulepreload" href="./components/ntx-method.js">
<link rel="modulepreload" href="./components/ntx-stream.js">
<link rel="modulepreload" href="./generators/form.js">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--surface-0);
    color: var(--text-0);
  }

  /* Hide NTX components until authenticated */
  ntx-chat-sidebar, ntx-chat-view { display: none; }
  body.authenticated ntx-chat-sidebar { display: flex; }
  body.authenticated ntx-chat-view { display: flex; }

  /* Login overlay */
  .login-overlay {
    position: fixed; inset: 0; background: var(--surface-0);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .login-box {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px; width: 340px;
  }
  .login-box h2 { margin-bottom: 20px; font-size: 20px; color: var(--accent-text); }
  .login-box input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px;
    background: var(--surface-2); color: var(--text-0);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; font-family: inherit; box-sizing: border-box;
  }
  .login-box input:focus { outline: none; border-color: var(--border-accent); }
  .login-box button {
    width: 100%; padding: 10px; margin-top: 4px;
    background: var(--accent); color: var(--surface-0); border: none;
    border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .login-box .error { color: var(--error); font-size: 13px; margin-bottom: 8px; }
  .login-box .toggle { margin-top: 12px; text-align: center; font-size: 13px; color: var(--text-2); }
  .login-box .toggle a { color: var(--accent-text); cursor: pointer; text-decoration: underline; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Auth overlay (vanilla JS — auth must work before NTX components load) -->
<div class="login-overlay" id="loginOverlay" style="display:none">
  <div class="login-box" id="loginForm">
    <h2>N3TX Chat</h2>
    <div class="error" id="loginError"></div>
    <input type="email" id="loginEmail" placeholder="Email" value="alice@example.com">
    <input type="password" id="loginPassword" placeholder="Password" value="alice123">
    <button id="btnLogin">Sign In</button>
    <div class="toggle">No account? <a id="showRegister">Register</a></div>
  </div>
  <div class="login-box hidden" id="registerForm">
    <h2>Register</h2>
    <div class="error" id="registerError"></div>
    <input type="text" id="registerName" placeholder="Name">
    <input type="email" id="registerEmail" placeholder="Email">
    <input type="password" id="registerPassword" placeholder="Password">
    <button id="btnRegister">Create Account</button>
    <div class="toggle">Have an account? <a id="showLogin">Sign in</a></div>
  </div>
</div>

<!-- Main layout (NTX components) -->
<ntx-chat-sidebar model="Conversation" id="sidebar"></ntx-chat-sidebar>
<ntx-chat-view id="chatView"></ntx-chat-view>

<script type="module">
  import { permissions } from './utils/Permissions.js';
  import './components/ntx-item.js';
  import './components/ntx-chat-sidebar.js';
  import './components/ntx-chat-conv.js';
  import './components/ntx-chat-view.js';
  import './components/ntx-chat-message.js';
  import './components/ntx-chat-input.js';

  const API = window.location.origin;

  // ── Auth ──

  function checkAuth() {
    const token = localStorage.getItem('jwtToken');
    if (!token) {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.body.classList.remove('authenticated');
      return false;
    }
    document.getElementById('loginOverlay').style.display = 'none';
    document.body.classList.add('authenticated');
    permissions.init();
    return true;
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      const resp = await fetch(`${API}/users/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, password}),
      });
      const data = await resp.json();
      // Actor routing wraps responses in {result: ...}
      const payload = data.result || data;
      if (payload.token) {
        localStorage.setItem('jwtToken', payload.token);
        // Reload so NTX components bootstrap with JWT available
        window.location.reload();
      } else {
        errEl.textContent = payload.detail || payload.error || data.detail || 'Login failed';
      }
    } catch (e) {
      errEl.textContent = 'Connection error';
    }
  }

  async function doRegister() {
    const name = document.getElementById('registerName').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const password = document.getElementById('registerPassword').value;
    const errEl = document.getElementById('registerError');
    errEl.textContent = '';
    if (!name || !email || !password) { errEl.textContent = 'All fields required'; return; }
    try {
      const resp = await fetch(`${API}/users/register`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, email, password}),
      });
      const data = await resp.json();
      const payload = data.result || data;
      if (payload.token) {
        localStorage.setItem('jwtToken', payload.token);
        window.location.reload();
      } else {
        errEl.textContent = payload.detail || payload.error || data.detail || 'Registration failed';
      }
    } catch (e) {
      errEl.textContent = 'Connection error';
    }
  }

  // ── Event bindings ──

  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('btnRegister').addEventListener('click', doRegister);

  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });

  document.getElementById('showRegister').addEventListener('click', () => {
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('registerForm').classList.remove('hidden');
    document.getElementById('registerError').textContent = '';
  });

  document.getElementById('showLogin').addEventListener('click', () => {
    document.getElementById('registerForm').classList.add('hidden');
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('loginError').textContent = '';
  });

  // ── Cross-component wiring ──

  document.addEventListener('select-conversation', (e) => {
    document.getElementById('chatView').loadConversation(e.detail);
  });

  // ── Init ──
  checkAuth();
</script>
</body>
</html>
