<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grant Watcher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dark-theme.css">
    <link rel="stylesheet" href="./light-theme.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <!-- Preload component CSS — loaded by Shadow DOM at runtime -->
    <link rel="preload" href="./components/ntt-item.css" as="style">
    <link rel="preload" href="./components/ntt-list.css" as="style">
    <link rel="preload" href="./components/ntt-router.css" as="style">
    <link rel="preload" href="./components/ntt-topbar.css" as="style">
    <link rel="preload" href="./components/ntt-sidebar.css" as="style">
    <link rel="preload" href="./components/ntt-table.css" as="style">
    <link rel="preload" href="./components/ntt-row.css" as="style">
    <link rel="preload" href="./components/ntt-user.css" as="style">
    <link rel="preload" href="./widgets/widgets.css" as="style">
    <!-- Vendor libraries (optional — widgets degrade gracefully without them) -->
    <script src="./vendor/marked.min.js"></script>
    <script src="./vendor/ansi_up.min.js"></script>
    <!-- Modulepreload entire dependency tree — eliminates import waterfall -->
    <!-- Leaves -->
    <link rel="modulepreload" href="./config.js">
    <link rel="modulepreload" href="./utils/Assert.js">
    <link rel="modulepreload" href="./utils/Logging.js">
    <link rel="modulepreload" href="./utils/Permissions.js">
    <link rel="modulepreload" href="./utils/theme.js">
    <!-- Core -->
    <link rel="modulepreload" href="./core/Utils.js">
    <link rel="modulepreload" href="./core/TX.js">
    <link rel="modulepreload" href="./core/Observable.js">
    <link rel="modulepreload" href="./core/Actor.js">
    <link rel="modulepreload" href="./core/Matrix.js">
    <link rel="modulepreload" href="./core/Component.js">
    <link rel="modulepreload" href="./core/Router.js">
    <link rel="modulepreload" href="./core/NTT.js">
    <!-- Transport -->
    <link rel="modulepreload" href="./core/transport/HTTP.js">
    <link rel="modulepreload" href="./core/transport/NetworkAdapter.js">
    <!-- Components -->
    <link rel="modulepreload" href="./components/NTTElement.js">
    <link rel="modulepreload" href="./components/ListElement.js">
    <link rel="modulepreload" href="./components/ntt-item.js">
    <link rel="modulepreload" href="./components/ntt-list.js">
    <link rel="modulepreload" href="./components/ntt-router.js">
    <link rel="modulepreload" href="./components/ntt-method.js">
    <link rel="modulepreload" href="./components/ntt-topbar.js">
    <link rel="modulepreload" href="./components/ntt-sidebar.js">
    <link rel="modulepreload" href="./components/ntt-profile.js">
    <link rel="modulepreload" href="./components/ntt-row.js">
    <link rel="modulepreload" href="./components/ntt-user.js">
    <link rel="modulepreload" href="./components/ntt-table.js">
    <link rel="modulepreload" href="./generators/form.js">
    <!-- Widgets -->
    <link rel="modulepreload" href="./widgets/Widget.js">
    <link rel="modulepreload" href="./widgets/registry.js">
    <link rel="modulepreload" href="./widgets/index.js">
    <script type="module" src="./utils/theme.js"></script>
</head>
<body>

    <ntt-topbar brand="Grant Watcher" version="0.10.0" logo="GW"></ntt-topbar>
    <ntt-sidebar router="main">
        <ntt-list model="Grant" allow-create></ntt-list>
        <ntt-table model="Source"></ntt-table>
        <ntt-list model="AgentActor"></ntt-list>
    </ntt-sidebar>

    <div class="page">
        <ntt-router name="main" hash>
            <ntt-table model="Grant" id="grant-table" allow-create></ntt-table>
        </ntt-router>
    </div>

    <script type="module">
        import Logging from './utils/Logging.js';
        Logging.init("Loading Grant Watcher...");

        import {Matrix, matrix} from './core/Matrix.js';
        import { NTT } from './core/NTT.js';
        import { config } from './config.js';
        import { permissions } from './utils/Permissions.js';
        import './components/ntt-item.js';
        import './components/ntt-list.js';
        import './components/ntt-router.js';
        import './components/ntt-method.js';
        import './components/ntt-topbar.js';
        import './components/ntt-sidebar.js';
        import './components/ntt-profile.js';
        import './components/ntt-user.js';
        import './components/ntt-row.js';
        import './components/ntt-table.js';

        // Initialize permissions (non-blocking — components degrade gracefully)
        permissions.init();
    </script>

</body>
</html>
